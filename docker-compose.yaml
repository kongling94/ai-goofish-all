services:
  all-app:
    build: .
    image: ai-goofish-all:local
    init: true
    restart: unless-stopped
    ports:
      - "${ALL_PORT:-8010}:8000"
    env_file: .env
    environment:
      SELLER_SERVICE_TOKEN: ${SELLER_SERVICE_TOKEN:?Set SELLER_SERVICE_TOKEN in .env}
      ALL_EXECUTION_MODE: ${ALL_EXECUTION_MODE:-preview}
      ALL_DATABASE_PATH: /app/data/commerce-${ALL_EXECUTION_MODE:-preview}.sqlite3
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD in .env}
      APP_DATABASE_FILE: /app/data/monitor.sqlite3
      SELLER_URL: http://seller-engine:8090
      SELLER_USERNAME: ${SELLER_USERNAME:-admin}
      SELLER_PASSWORD: ${SELLER_PASSWORD:?Set SELLER_PASSWORD in .env}
    volumes:
      - ./.env:/app/.env
      - ./runtime/monitor:/app/data
      - ./runtime/state:/app/state
      - ./runtime/logs:/app/logs
      - prompts:/app/prompts
    depends_on:
      seller-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  seller-engine:
    build: ./vendor/xianyu-auto-reply-fix
    image: ai-goofish-all-seller:local
    init: true
    restart: unless-stopped
    environment:
      SELLER_SERVICE_TOKEN: ${SELLER_SERVICE_TOKEN:?Set SELLER_SERVICE_TOKEN in .env}
      ALL_EXECUTION_MODE: ${ALL_EXECUTION_MODE:-preview}
      DB_PATH: /app/data/seller-${ALL_EXECUTION_MODE:-preview}.sqlite3
      ADMIN_USERNAME: ${SELLER_USERNAME:-admin}
      ADMIN_PASSWORD: ${SELLER_PASSWORD:?Set SELLER_PASSWORD in .env}
      JWT_SECRET_KEY: ${SELLER_JWT_SECRET:?Set SELLER_JWT_SECRET in .env}
      USER_REGISTRATION_ENABLED: "false"
      USE_XVFB: "true"
      ENABLE_HEADFUL: "true"
      ENABLE_VNC: "false"
      DISPLAY: ":99"
      TZ: Asia/Shanghai
    volumes:
      - ./runtime/seller:/app/data
      - ./runtime/seller-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

volumes:
  prompts:
